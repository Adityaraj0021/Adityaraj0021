<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes rotateCube {
        0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
        100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(180deg); }
      }
      
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(74, 144, 226, 0.5)); }
        50% { filter: drop-shadow(0 0 20px rgba(74, 144, 226, 0.8)); }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      
      .cube {
        animation: rotateCube 8s linear infinite;
        transform-style: preserve-3d;
      }
      
      .face {
        position: absolute;
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #4A90E2, #7B68EE);
        border: 2px solid rgba(74, 144, 226, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        opacity: 0.85;
      }
      
      .glow {
        animation: glowPulse 2s infinite;
      }
      
      text {
        font-weight: bold;
      }
    </style>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="100" cy="100" r="70" fill="rgba(74, 144, 226, 0.1)" filter="url(#glow)" class="glow"/>
  
  <!-- Rotating Cube Group -->
  <g class="cube" style="transform-origin: 100px 100px">
    <!-- Front Face (🤖) -->
    <rect x="60" y="60" width="80" height="80" fill="url(#grad1)" stroke="rgba(74, 144, 226, 0.8)" stroke-width="2" opacity="0.85"/>
    <text x="100" y="110" text-anchor="middle" font-size="40" dominant-baseline="middle">🤖</text>
    
    <!-- Back Face (🧠) -->
    <rect x="60" y="60" width="80" height="80" fill="url(#grad2)" stroke="rgba(74, 144, 226, 0.8)" stroke-width="2" opacity="0.7" transform="rotateY(180deg) translate(-160, 0)"/>
    <text x="100" y="110" text-anchor="middle" font-size="40" dominant-baseline="middle" transform="rotateY(180deg) translate(-160, 0)" fill="white">🧠</text>
    
    <!-- Right Face (✨) -->
    <rect x="140" y="60" width="80" height="80" fill="url(#grad3)" stroke="rgba(74, 144, 226, 0.8)" stroke-width="2" opacity="0.85" transform="rotateY(90deg) translate(0, 0)"/>
    <text x="180" y="110" text-anchor="middle" font-size="40" dominant-baseline="middle" transform="rotateY(90deg) translate(0, 0)">✨</text>
    
    <!-- Left Face (🔗) -->
    <rect x="-20" y="60" width="80" height="80" fill="url(#grad4)" stroke="rgba(74, 144, 226, 0.8)" stroke-width="2" opacity="0.85" transform="rotateY(-90deg) translate(0, 0)"/>
    <text x="20" y="110" text-anchor="middle" font-size="40" dominant-baseline="middle" transform="rotateY(-90deg) translate(0, 0)">🔗</text>
    
    <!-- Top Face (📊) -->
    <rect x="60" y="0" width="80" height="80" fill="url(#grad5)" stroke="rgba(74, 144, 226, 0.8)" stroke-width="2" opacity="0.85" transform="rotateX(90deg) translate(0, -160)"/>
    <text x="100" y="40" text-anchor="middle" font-size="40" dominant-baseline="middle" transform="rotateX(90deg) translate(0, -160)">📊</text>
    
    <!-- Bottom Face (⚡) -->
    <rect x="60" y="140" width="80" height="80" fill="url(#grad6)" stroke="rgba(74, 144, 226, 0.8)" stroke-width="2" opacity="0.85" transform="rotateX(-90deg) translate(0, 160)"/>
    <text x="100" y="180" text-anchor="middle" font-size="40" dominant-baseline="middle" transform="rotateX(-90deg) translate(0, 160)">⚡</text>
  </g>

  <!-- Floating Particles -->
  <circle cx="40" cy="70" r="2" fill="#4A90E2" opacity="0.6" style="animation: float 2s ease-in-out infinite;"/>
  <circle cx="160" cy="80" r="2" fill="#4A90E2" opacity="0.6" style="animation: float 2s ease-in-out infinite 0.3s;"/>
  <circle cx="100" cy="140" r="2" fill="#4A90E2" opacity="0.6" style="animation: float 2s ease-in-out infinite 0.6s;"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B68EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B68EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>