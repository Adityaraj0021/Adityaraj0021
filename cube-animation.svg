<svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes orbitRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes nodePulse {
        0%, 100% { r: 4px; filter: drop-shadow(0 0 3px rgba(74, 144, 226, 0.5)); }
        50% { r: 6px; filter: drop-shadow(0 0 12px rgba(74, 144, 226, 0.9)); }
      }
      
      @keyframes coreGlow {
        0%, 100% { r: 8px; filter: drop-shadow(0 0 5px rgba(123, 104, 238, 0.6)) drop-shadow(0 0 20px rgba(74, 144, 226, 0.3)); }
        50% { r: 10px; filter: drop-shadow(0 0 15px rgba(123, 104, 238, 0.9)) drop-shadow(0 0 35px rgba(74, 144, 226, 0.6)); }
      }
      
      @keyframes dataFlow {
        0% { offset-distance: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      
      @keyframes energyRing {
        0%, 100% { stroke-width: 1.5; stroke-dashoffset: 0; opacity: 0.4; }
        50% { stroke-width: 2.5; stroke-dashoffset: -10; opacity: 0.8; }
      }
      
      @keyframes floatUp {
        0%, 100% { transform: translateY(0px); opacity: 0; }
        50% { opacity: 1; }
      }
      
      .core-node {
        animation: coreGlow 2s ease-in-out infinite;
      }
      
      .orbital-node {
        animation: nodePulse 1.5s ease-in-out infinite;
      }
      
      .particle {
        animation: dataFlow 3s ease-in infinite;
      }
      
      .orbit {
        animation: orbitRotate 12s linear infinite;
      }
      
      .inner-orbit {
        animation: orbitRotate 8s linear infinite reverse;
      }
      
      .energy-ring {
        animation: energyRing 2s ease-in-out infinite;
        stroke-dasharray: 10, 5;
      }
      
      .float-particle {
        animation: floatUp 3s ease-in-out infinite;
      }
    </style>
    
    <!-- Gradients -->
    <radialGradient id="coreGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:0.8" />
    </radialGradient>
    
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#7B68EE;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:0.7" />
    </linearGradient>
    
    <!-- Data flow paths -->
    <path id="flow1" d="M 140 140 L 180 100" fill="none"/>
    <path id="flow2" d="M 140 140 L 200 140" fill="none"/>
    <path id="flow3" d="M 140 140 L 180 180" fill="none"/>
    <path id="flow4" d="M 140 140 L 100 100" fill="none"/>
    <path id="flow5" d="M 140 140 L 80 140" fill="none"/>
    <path id="flow6" d="M 140 140 L 100 180" fill="none"/>
  </defs>
  
  <!-- Background glow -->
  <circle cx="140" cy="140" r="120" fill="rgba(74, 144, 226, 0.03)" opacity="0.5"/>
  <circle cx="140" cy="140" r="110" fill="none" stroke="rgba(74, 144, 226, 0.08)" stroke-width="1"/>
  
  <!-- Outer rotating ring with data nodes -->
  <g class="orbit">
    <!-- Outer orbit ring -->
    <circle cx="140" cy="140" r="95" fill="none" stroke="rgba(123, 104, 238, 0.15)" stroke-width="1.5" stroke-dasharray="5,5"/>
    
    <!-- Orbital nodes with connections -->
    <circle cx="235" cy="140" r="4" fill="#4A90E2" class="orbital-node"/>
    <circle cx="200" cy="90" r="4" fill="#7B68EE" class="orbital-node"/>
    <circle cx="140" cy="45" r="4" fill="#FF6B9D" class="orbital-node"/>
    <circle cx="80" cy="90" r="4" fill="#4A90E2" class="orbital-node"/>
    <circle cx="45" cy="140" r="4" fill="#7B68EE" class="orbital-node"/>
    <circle cx="80" cy="190" r="4" fill="#FF6B9D" class="orbital-node"/>
    <circle cx="140" cy="235" r="4" fill="#4A90E2" class="orbital-node"/>
    <circle cx="200" cy="190" r="4" fill="#7B68EE" class="orbital-node"/>
  </g>
  
  <!-- Inner rotating ring (reverse direction) -->
  <g class="inner-orbit">
    <circle cx="140" cy="140" r="60" fill="none" stroke="rgba(255, 107, 157, 0.12)" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <!-- Inner nodes -->
    <circle cx="200" cy="140" r="3.5" fill="#FF6B9D" class="orbital-node"/>
    <circle cx="170" cy="85" r="3.5" fill="#4A90E2" class="orbital-node"/>
    <circle cx="140" cy="80" r="3.5" fill="#7B68EE" class="orbital-node"/>
    <circle cx="110" cy="85" r="3.5" fill="#FF6B9D" class="orbital-node"/>
    <circle cx="80" cy="140" r="3.5" fill="#4A90E2" class="orbital-node"/>
    <circle cx="110" cy="195" r="3.5" fill="#7B68EE" class="orbital-node"/>
  </g>
  
  <!-- Energy rings -->
  <circle cx="140" cy="140" r="70" fill="none" stroke="url(#pathGrad)" class="energy-ring" stroke-linecap="round"/>
  <circle cx="140" cy="140" r="100" fill="none" stroke="url(#pathGrad)" class="energy-ring" stroke-linecap="round" style="animation-delay: 0.3s;"/>
  
  <!-- Data flow particles -->
  <g class="particle">
    <circle r="2.5" fill="#4A90E2">
      <animateMotion dur="3s" repeatCount="indefinite">
        <mpath href="#flow1"/>
      </animateMotion>
    </circle>
  </g>
  
  <g class="particle" style="animation-delay: 0.5s;">
    <circle r="2.5" fill="#7B68EE">
      <animateMotion dur="3s" repeatCount="indefinite">
        <mpath href="#flow2"/>
      </animateMotion>
    </circle>
  </g>
  
  <g class="particle" style="animation-delay: 1s;">
    <circle r="2.5" fill="#FF6B9D">
      <animateMotion dur="3s" repeatCount="indefinite">
        <mpath href="#flow3"/>
      </animateMotion>
    </circle>
  </g>
  
  <g class="particle" style="animation-delay: 1.5s;">
    <circle r="2.5" fill="#4A90E2">
      <animateMotion dur="3s" repeatCount="indefinite">
        <mpath href="#flow4"/>
      </animateMotion>
    </circle>
  </g>
  
  <g class="particle" style="animation-delay: 2s;">
    <circle r="2.5" fill="#7B68EE">
      <animateMotion dur="3s" repeatCount="indefinite">
        <mpath href="#flow5"/>
      </animateMotion>
    </circle>
  </g>
  
  <g class="particle" style="animation-delay: 2.5s;">
    <circle r="2.5" fill="#FF6B9D">
      <animateMotion dur="3s" repeatCount="indefinite">
        <mpath href="#flow6"/>
      </animateMotion>
    </circle>
  </g>
  
  <!-- Core processing node -->
  <circle cx="140" cy="140" r="8" fill="url(#coreGrad)" class="core-node"/>
  
  <!-- AI label with glow -->
  <g>
    <text x="140" y="147" text-anchor="middle" font-size="11" fill="#FF6B9D" font-weight="bold" opacity="0.9">AI</text>
  </g>
  
  <!-- Floating enhancement particles around core -->
  <g class="float-particle" style="animation-delay: 0s;">
    <circle cx="165" cy="125" r="1.5" fill="#4A90E2" opacity="0.6"/>
  </g>
  <g class="float-particle" style="animation-delay: 1s;">
    <circle cx="155" cy="155" r="1.5" fill="#7B68EE" opacity="0.6"/>
  </g>
  <g class="float-particle" style="animation-delay: 2s;">
    <circle cx="125" cy="165" r="1.5" fill="#FF6B9D" opacity="0.6"/>
  </g>
  <g class="float-particle" style="animation-delay: 0.5s;">
    <circle cx="115" cy="125" r="1.5" fill="#4A90E2" opacity="0.6"/>
  </g>
  
</svg>